name: 每日更新赛事数据

on:
  schedule:
    # UTC 23:30 = 北京时间 07:30，赶在早上 8 点前完成更新
    - cron: "30 23 * * *"
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write
  issues: write # 失败告警开/追加 Issue 用内置 GITHUB_TOKEN，无需额外密钥

jobs:
  update:
    runs-on: ubuntu-latest
    # 千问 API 挂起/网络异常时的兜底：默认 360 分钟太宽，会白烧 Actions 配额；
    # 120 分钟按「上百场赛事 × 单场最慢一次联网查询」留足余量，正常远达不到
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 联网查询赛事进展（千问 API）
        run: npx tsx scripts/update-status.ts
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}

      - name: 发布前检测（字段契约 + 日期一致性 + 官网实测，不通过则不提交）
        run: npx tsx scripts/verify-data.ts

      - name: 提交数据更新
        run: |
          git config user.name "marathon-bot"
          git config user.email "marathon-bot@users.noreply.github.com"
          git add data/races.json data/todaySites.json
          git diff --cached --quiet || git commit -m "chore: 更新赛事数据 $(date -u +%F)"
          git push

      # 数据提交成功后再生成简报：dateChanges.json 是运行时产物不入库，
      # 必须与 update-status 在同一个 job 内读盘渲染（此前脚本写好但从未被调用）
      - name: 生成并发送每日简报邮件（Resend）
        run: npx tsx scripts/email-digest.ts
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      # 简报会覆盖两份对比基线：knownIds.json（次日"新入库"）+ digestBaseline.json（次日"新动态"，
      # 上一日的 regStart/regEnd/lotteryDate 快照），不提交则每天重复报同一批
      - name: 提交简报快照（knownIds + 字段基线）
        run: |
          git config user.name "marathon-bot"
          git config user.email "marathon-bot@users.noreply.github.com"
          # 先暂存再 pull：pull --rebase 遇到未暂存改动会直接拒绝退出（2026-09-28 事故，
          # knownIds.json 刚被 email-digest 覆盖，正是这一步唯一的未暂存改动）
          git add data/knownIds.json data/digestBaseline.json
          git diff --cached --quiet || git commit -m "chore: 更新简报快照 $(date -u +%F)"
          git pull --rebase
          git push

      # 任一环节失败 → 开/追加告警 Issue。此前事故：流水线连续失败 6 天毫无动静
      - name: 流水线失败告警
        if: failure()
        run: python3 scripts/alert-failure.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: 每日更新赛事数据

on:
  schedule:
    # UTC 23:30 = 北京时间 07:30，赶在早上 8 点前完成更新
    - cron: "30 23 * * *"
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 联网查询赛事进展（千问 API）
        run: npx tsx scripts/update-status.ts
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}

      - name: 发布前检测（日期一致性 + 官网实测，不通过则不提交）
        run: npx tsx scripts/verify-data.ts

      - name: 提交数据更新
        run: |
          git config user.name "marathon-bot"
          git config user.email "marathon-bot@users.noreply.github.com"
          git add data/races.json
          git diff --cached --quiet || git commit -m "chore: 更新赛事数据 $(date -u +%F)"
          git push

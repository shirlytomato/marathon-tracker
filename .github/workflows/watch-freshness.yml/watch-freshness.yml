name: 数据新鲜度心跳（不调 AI）

on:
  schedule:
    # UTC 00:30 = 北京时间 08:30，本机 07:30 那班之后一小时
    - cron: "30 0 * * *"
  workflow_dispatch: # 支持手动触发

permissions:
  contents: read
  issues: write # 告警 Issue 用内置 GITHUB_TOKEN，无需额外密钥

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 要翻提交历史找最近一次数据提交，浅克隆会看不到
          fetch-depth: 0

      - name: 检查数据新鲜度（超 36 小时未更新则变红）
        run: python3 scripts/check-freshness.py

      # 这一步只负责"告诉你该去开电脑"，不重复解释 API 病因
      - name: 数据陈旧告警
        if: failure()
        run: python3 scripts/alert-failure.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALERT_HINT: |
            这条任务不调 AI，它只盯"main 上最近一次数据提交距今多久"。
            每日更新由本机 Mac 的 07:30 定时任务产生（套餐端点境外不可达，所以没放在 Actions）。
            变红大概率是那台电脑没开机/没网，或脚本自身失败——本机日志在 ~/Library/Logs/pbrun-daily-update.log。
            补救：在仓库目录执行 bash scripts/daily-update-mac.sh

name: 数据新鲜度心跳（不调 AI）

on:
  schedule:
    # UTC 00:30 = 北京时间 08:30。本机定时更新在 20:00，平均 3 天一轮，
    # 心跳只判断"是否超过 96 小时没有正常复查"（阈值在 check-freshness.py）。
    - cron: "30 0 * * *"
  workflow_dispatch: # 支持手动触发

permissions:
  contents: read
  issues: write # 告警 Issue 用内置 GITHUB_TOKEN，无需额外密钥

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查数据新鲜度（超 96 小时无正常复查则变红）
        run: python3 scripts/check-freshness.py

      # 这一步只负责"告诉你该去开电脑"，不重复解释 API 病因
      - name: 数据陈旧告警
        if: failure()
        run: python3 scripts/alert-failure.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALERT_HINT: |
            心跳检查 main 上最近一次正常完成的全量复查。手工补录赛事不会刷新这个时间。
            请检查 data/update-health.json 和更新机器的运行日志。
            本机更新日志：~/Library/Logs/pbrun-daily-update.log。
